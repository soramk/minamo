<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minamo | 市場観測</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium feel -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Minamo</h1>
            <div class="subtitle">Market Ripple Observer</div>
        </header>

        <div id="app">
            <div id="status">Scanning the surface...</div>
        </div>
    </div>

    <script>
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error("Data not found");
                return response.json();
            })
            .then(data => {
                const app = document.getElementById('app');
                app.innerHTML = ''; // ローディング消去

                // データ構造の正規化
                let companies = [];
                let metadata = null;

                if (Array.isArray(data)) {
                    companies = data;
                } else if (data.companies) {
                    companies = data.companies;
                    metadata = data.metadata;
                }

                if (!companies || companies.length === 0) {
                    app.innerHTML = '<div id="status">No ripples detected.<br><small>データがありません</small></div>';
                    return;
                }

                // メタデータ表示（トークン数など）
                if (metadata && metadata.token_usage) {
                    const totalTokens = metadata.token_usage.total_tokens || 0;
                    const metaHtml = `
                        <div class="system-status" style="text-align: center; color: var(--text-sub); font-size: 0.8rem; margin-bottom: 2rem; opacity: 0.8;">
                            <span style="display: inline-block; padding: 4px 12px; background: rgba(255,255,255,0.05); border-radius: 20px;">
                                Last Scan: ${metadata.updated_at} &nbsp;|&nbsp; Token Usage: ${totalTokens.toLocaleString()}
                            </span>
                        </div>
                    `;
                    app.innerHTML += metaHtml;
                }

                companies.forEach(company => {
                    // スコアに応じたクラス
                    let scoreClass = 'score-low';
                    if (company.average_score >= 8) scoreClass = 'score-high';
                    else if (company.average_score >= 5) scoreClass = 'score-mid';

                    // ニュースリストのHTML生成
                    let newsHtml = '';
                    if (company.news && company.news.length > 0) {
                        newsHtml = '<ul class="news-list">';
                        company.news.forEach(news => {
                            let newsScoreClass = 'text-low';
                            if (news.score >= 8) newsScoreClass = 'text-high';
                            else if (news.score >= 5) newsScoreClass = 'text-mid';

                            newsHtml += `
                               <li class="news-item">
                                   <div class="news-score ${newsScoreClass}">${news.score}</div>
                                   <div class="news-content">
                                       <a href="${news.link}" target="_blank" class="news-title">${news.title}</a>
                                       <div class="news-reason">${news.reason}</div>
                                   </div>
                               </li>
                           `;
                        });
                        newsHtml += '</ul>';
                    } else {
                        newsHtml = '<div class="no-news">No recent news analyzed.</div>';
                    }

                    const html = `
                        <div class="company-card">
                            <div class="company-info">
                                <h2>${company.company}</h2>
                                <div class="main-score ${scoreClass}">
                                    <span class="score-label">AI SCORE</span>
                                    <span class="score-value">${company.average_score}</span>
                                </div>
                                <div class="updated-at">Updated: ${company.updated_at}</div>
                            </div>
                            <div class="company-news">
                                <h3>Latest Analysis</h3>
                                ${newsHtml}
                            </div>
                        </div>
                    `;
                    app.innerHTML += html;
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('status').innerHTML =
                    'まだ水面は静かです。<br><small>(データ読み込みエラー、または初回実行待ちです)</small>';
            });
    </script>
</body>

</html>
