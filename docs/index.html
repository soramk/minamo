<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minamo | 市場観測</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium feel -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <!-- Mobile Menu Button -->
    <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="メニューを開く">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
    </button>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="minamo.png" alt="Minamo Logo" class="sidebar-logo">
            </div>

            <div class="search-box">
                <input type="text" id="companySearch" class="search-input" placeholder="企業名や銘柄コードで検索...">
            </div>

            <div class="menu-section">
                <h3 class="menu-title">業種別ナビ</h3>
                <ul id="sectorMenu" class="menu-list">
                    <!-- JavaScript will populate this -->
                </ul>
            </div>

            <div class="menu-section">
                <h3 class="menu-title">ソート・フィルター</h3>
                <ul class="menu-list">
                    <li class="menu-item" onclick="setSort('score')">スコア順</li>
                    <li class="menu-item" onclick="setSort('accuracy')">的中率順</li>
                    <li class="menu-item" onclick="setSort('change')">前日比順</li>
                </ul>
            </div>

            <div id="marketSummary" class="market-summary">
                <h3 class="menu-title" style="margin-bottom: 0.5rem;">市場概況</h3>
                <div id="summaryContent">
                    <!-- JavaScript will populate this -->
                </div>
            </div>
        </aside>

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="main-header">
                <div>
                    <h1>Market Ripple</h1>
                    <div class="subtitle">AI-Driven Stock Analysis Observer</div>
                </div>
                <div class="history-controls">
                    <button id="showHistoryBtn" class="history-btn">履歴を表示</button>
                    <input type="date" id="historyDatePicker" class="history-date-picker" style="display: none;">
                    <select id="historySelect" class="history-select" style="display: none;">
                        <option value="">最新データを表示</option>
                    </select>
                </div>
            </div>

            <div id="app">
                <div id="status">Scanning the surface...</div>
            </div>
        </main>
    </div>

    <script>
        let historyData = [];
        let companyCharts = {}; // 企業ごとのグラフを保持

        // モバイルメニューの制御
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.querySelector('.sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
            mobileMenuBtn.classList.toggle('active');
            document.body.classList.toggle('no-scroll');
        }

        if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', toggleSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);

        // メニューアイテムがクリックされたらサイドバーを閉じる (モバイルのみ)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768 &&
                sidebar.classList.contains('active') &&
                e.target.closest('.menu-item')) {
                toggleSidebar();
            }
        });

        // 企業ごとのグラフを描画
        function drawCompanyGraph(companyName, historyData, period = 'month') {
            if (!historyData || historyData.length === 0) return;

            const canvasId = `chart-${companyName.replace(/\s+/g, '-')}`;
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            // 既存のグラフを破棄
            if (companyCharts[companyName]) {
                companyCharts[companyName].destroy();
            }

            // 期間に応じてデータを取得
            const now = new Date();
            const startDate = new Date();

            switch (period) {
                case 'week':
                    startDate.setDate(now.getDate() - 7);
                    break;
                case 'month':
                    startDate.setMonth(now.getMonth() - 1);
                    break;
                case 'year':
                    startDate.setFullYear(now.getFullYear() - 1);
                    break;
            }

            const filteredData = historyData.filter(entry => {
                const entryDate = new Date(entry.timestamp);
                return entryDate >= startDate;
            }).reverse();

            const labels = [];
            const scores = [];
            const accuracies = [];

            filteredData.forEach(entry => {
                if (!entry.data || !entry.data.companies) return;

                const company = entry.data.companies.find(c => c.company === companyName);
                if (!company) return;

                const date = entry.timestamp.split(' ')[0];
                // 期間に応じて日付フォーマットを変更
                if (period === 'year') {
                    labels.push(date.split('-').slice(0, 2).join('/')); // YYYY/MM形式
                } else {
                    labels.push(date.split('-').slice(1).join('/')); // MM/DD形式
                }
                scores.push(company.average_score || 0);

                if (company.score_evaluation && company.score_evaluation.accuracy !== undefined) {
                    accuracies.push(company.score_evaluation.accuracy);
                } else {
                    accuracies.push(null);
                }
            });

            if (labels.length === 0) return;

            const ctx = canvas.getContext('2d');
            companyCharts[companyName] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'スコア',
                            data: scores,
                            borderColor: 'rgb(56, 189, 248)',
                            backgroundColor: 'rgba(56, 189, 248, 0.1)',
                            tension: 0.4,
                            fill: true,
                            yAxisID: 'y'
                        },
                        {
                            label: '精度',
                            data: accuracies,
                            borderColor: 'rgb(74, 222, 128)',
                            backgroundColor: 'rgba(74, 222, 128, 0.1)',
                            tension: 0.4,
                            fill: true,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: 'rgb(226, 232, 240)',
                                font: {
                                    size: 10
                                }
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                color: 'rgb(148, 163, 184)',
                                font: {
                                    size: 9
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                color: 'rgb(148, 163, 184)',
                                font: {
                                    size: 9
                                }
                            },
                            grid: {
                                drawOnChartArea: false
                            }
                        },
                        x: {
                            ticks: {
                                color: 'rgb(148, 163, 184)',
                                font: {
                                    size: 9
                                },
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            }
                        }
                    }
                }
            });
        }

        let currentSectorFilter = '';
        let allCompaniesData = [];
        let currentMetadata = null;
        let currentSortType = 'score'; // 'score', 'accuracy', 'change'

        function setSort(type) {
            currentSortType = type;
            // 再表示
            if (allCompaniesData.length > 0) {
                const currentData = {
                    companies: allCompaniesData,
                    metadata: currentMetadata
                };
                displayData(currentData);
            }
        }

        // 市場サマリーを計算
        function updateMarketSummary(companies) {
            const summaryDiv = document.getElementById('summaryContent');
            if (companies.length === 0) return;

            const avgScore = Math.round(companies.reduce((acc, c) => acc + (c.average_score || 0), 0) / companies.length);
            const upCount = companies.filter(c => c.stock_info && c.stock_info.price_change > 0).length;
            const downCount = companies.filter(c => c.stock_info && c.stock_info.price_change < 0).length;

            const totalTokens = (currentMetadata && currentMetadata.token_usage) ? currentMetadata.token_usage.total_tokens : 0;

            summaryDiv.innerHTML = `
                <div class="summary-item">
                    <span class="summary-label">対象企業数</span>
                    <span class="summary-value">${companies.length}社</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">平均AIスコア</span>
                    <span class="summary-value">${avgScore}点</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">上昇銘柄数</span>
                    <span class="summary-value text-high">${upCount}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">下落銘柄数</span>
                    <span class="summary-value text-low">${downCount}</span>
                </div>
                <div class="summary-item" style="margin-top: 0.5rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.5rem; opacity: 0.6;">
                    <span class="summary-label">ScanTime</span>
                    <span class="summary-value">${currentMetadata ? currentMetadata.updated_at.split(' ')[1] : '-'}</span>
                </div>
            `;
        }

        // 統計情報を計算する関数
        function calculateStats(companyName, historyData) {
            const upPredictions = []; // 実際の株価が上がった日の予測
            const downPredictions = []; // 実際の株価が下がった日の予測

            // 履歴データからその企業の過去の実績を集計
            const companyHistory = historyData.filter(entry => entry.data && entry.data.companies)
                .map(entry => {
                    const c = entry.data.companies.find(comp => comp.company === companyName);
                    return c ? { ...c, timestamp: entry.timestamp } : null;
                })
                .filter(c => c && c.stock_info && c.average_score !== undefined);

            let upCorrect = 0, upTotal = 0;
            let downCorrect = 0, downTotal = 0;

            companyHistory.forEach(c => {
                const change = c.stock_info.price_change_percent;
                const score = c.average_score;

                if (change > 0) {
                    upTotal++;
                    if (score >= 50) upCorrect++;
                } else if (change < 0) {
                    downTotal++;
                    if (score < 50) downCorrect++;
                }
            });

            const upAccuracy = upTotal > 0 ? (upCorrect / upTotal * 100).toFixed(1) : '-';
            const downAccuracy = downTotal > 0 ? (downCorrect / downTotal * 100).toFixed(1) : '-';

            return { upAccuracy, downAccuracy, upTotal, downTotal };
        }

        // 売買シグナルを生成する関数
        function getSignal(score, stats) {
            // スコアが高いほど「買い」、低いほど「売り」
            // 精度（過去の勝率）も考慮する
            const upAcc = parseFloat(stats.upAccuracy) || 0;
            const downAcc = parseFloat(stats.downAccuracy) || 0;

            if (score >= 80) {
                return {
                    type: 'buy',
                    label: '強気買い',
                    subtitle: `上昇的中率: ${stats.upAccuracy}%`,
                    class: 'signal-buy'
                };
            } else if (score >= 65) {
                return {
                    type: 'buy',
                    label: '買い検討',
                    subtitle: `上昇期待度高`,
                    class: 'signal-buy'
                };
            } else if (score <= 20) {
                return {
                    type: 'sell',
                    label: '強気売り',
                    subtitle: `下落的中率: ${stats.downAccuracy}%`,
                    class: 'signal-sell'
                };
            } else if (score <= 35) {
                return {
                    type: 'sell',
                    label: '売り検討',
                    subtitle: `下落期待度高`,
                    class: 'signal-sell'
                };
            } else {
                return {
                    type: 'neutral',
                    label: '様子見',
                    subtitle: 'シグナルなし',
                    class: 'signal-neutral'
                };
            }
        }

        // データを表示する関数
        function displayData(data) {
            console.log('displayData called with:', data);
            const app = document.getElementById('app');
            app.innerHTML = ''; // ローディング消去

            // データ構造の正規化
            let companies = [];
            let metadata = null;

            if (Array.isArray(data)) {
                companies = data;
            } else if (data.companies) {
                companies = data.companies;
                metadata = data.metadata;
            }

            console.log('Companies after normalization:', companies.length);

            if (!companies || companies.length === 0) {
                console.warn('No companies data found');
                app.innerHTML = '<div id="status">No ripples detected.<br><small>データがありません</small></div>';
                return;
            }

            // 全企業データを保存
            allCompaniesData = companies;
            currentMetadata = metadata;

            // 市場サマリーの更新
            updateMarketSummary(allCompaniesData);

            // 業種メニューを更新
            updateSectorMenu(allCompaniesData);

            // 検索とフィルタ適用
            const searchQuery = document.getElementById('companySearch').value.toLowerCase();
            let filteredCompanies = companies;

            if (searchQuery) {
                filteredCompanies = filteredCompanies.filter(c =>
                    c.company.toLowerCase().includes(searchQuery) ||
                    (c.stock_info && c.stock_info.ticker.toLowerCase().includes(searchQuery))
                );
            }

            if (currentSectorFilter) {
                filteredCompanies = filteredCompanies.filter(company => company.sector === currentSectorFilter);
            }

            // ソート適用
            filteredCompanies.sort((a, b) => {
                if (currentSortType === 'score') return (b.average_score || 0) - (a.average_score || 0);
                if (currentSortType === 'accuracy') {
                    // 上昇・下落の平均的中率でソート
                    const aScore = (parseFloat(calculateStats(a.company, historyData).upAccuracy) || 0) + (parseFloat(calculateStats(a.company, historyData).downAccuracy) || 0);
                    const bScore = (parseFloat(calculateStats(b.company, historyData).upAccuracy) || 0) + (parseFloat(calculateStats(b.company, historyData).downAccuracy) || 0);
                    return bScore - aScore;
                }
                if (currentSortType === 'change') {
                    const aChange = a.stock_info ? a.stock_info.price_change_percent : -999;
                    const bChange = b.stock_info ? b.stock_info.price_change_percent : -999;
                    return bChange - aChange;
                }
                return 0;
            });

            // 業種でグループ化
            const companiesBySector = {};
            filteredCompanies.forEach(company => {
                const sector = company.sector || 'その他';
                if (!companiesBySector[sector]) {
                    companiesBySector[sector] = [];
                }
                companiesBySector[sector].push(company);
            });

            // 不要なメタデータ表示を削除（サマリーに集約）

            // 既存のグラフを全て破棄
            Object.values(companyCharts).forEach(chart => {
                if (chart) chart.destroy();
            });
            companyCharts = {};

            // 業種ごとに表示
            const sortedSectors = Object.keys(companiesBySector).sort();

            sortedSectors.forEach(sector => {
                const sectorCompanies = companiesBySector[sector];

                // 業種セクションのヘッダー
                const sectorHeader = `
                    <div class="sector-section">
                        <h2 class="sector-title">${sector}</h2>
                    </div>
                `;
                app.innerHTML += sectorHeader;

                sectorCompanies.forEach(company => {
                    // スコアに応じたクラス（100点満点）
                    let scoreClass = 'score-low';
                    if (company.average_score >= 70) scoreClass = 'score-high';
                    else if (company.average_score >= 50) scoreClass = 'score-mid';

                    // 株価情報のHTML生成
                    let stockHtml = '';
                    if (company.stock_info) {
                        const stock = company.stock_info;
                        const changeClass = stock.price_change >= 0 ? 'text-high' : 'text-low';
                        stockHtml = `
                        <div class="stock-info">
                            <div class="stock-price">
                                <span class="stock-label">現在価格</span>
                                <span class="stock-value">¥${stock.current_price.toLocaleString()}</span>
                            </div>
                            <div class="stock-change ${changeClass}">
                                <span class="stock-label">前日比</span>
                                <span class="stock-value">${stock.price_change >= 0 ? '+' : ''}${stock.price_change.toFixed(2)} (${stock.price_change_percent >= 0 ? '+' : ''}${stock.price_change_percent.toFixed(2)}%)</span>
                            </div>
                        </div>
                    `;
                    }

                    // 統計とシグナルを計算
                    const stats = calculateStats(company.company, historyData);
                    const signal = getSignal(company.average_score, stats);

                    // スコア評価のHTML生成
                    let evaluationHtml = '';
                    if (company.score_evaluation) {
                        const eval = company.score_evaluation;
                        let statusClass = 'eval-hit';
                        if (eval.status === '外れ') statusClass = 'eval-miss';
                        else if (eval.status === '部分的的中') statusClass = 'eval-partial';

                        evaluationHtml = `
                        <div class="score-evaluation ${statusClass}">
                            <div class="eval-header">前回の検証</div>
                            <div class="eval-details">
                                <div class="eval-item">
                                    <span class="eval-label">予測:</span>
                                    <span class="eval-value">${eval.prediction}</span>
                                </div>
                                <div class="eval-item">
                                    <span class="eval-label">結果:</span>
                                    <span class="eval-value">${eval.status} (${eval.actual})</span>
                                </div>
                            </div>
                        </div>
                    `;
                    }

                    const accuracyStatsHtml = `
                    <div class="accuracy-stats">
                        <div class="stat-box up">
                            <span class="stat-label">上昇的中率</span>
                            <span class="stat-value">${stats.upAccuracy}%</span>
                        </div>
                        <div class="stat-box down">
                            <span class="stat-label">下落的中率</span>
                            <span class="stat-value">${stats.downAccuracy}%</span>
                        </div>
                    </div>
                `;

                    const signalHtml = `
                    <div class="decision-signal ${signal.class}">
                        <span>${signal.label}</span>
                        <span class="signal-subtitle">${signal.subtitle}</span>
                    </div>
                `;

                    // ニュースリストのHTML生成
                    let newsHtml = '';
                    if (company.news && company.news.length > 0) {
                        newsHtml = '<ul class="news-list">';
                        company.news.forEach(news => {
                            let newsScoreClass = 'text-low';
                            if (news.score >= 70) newsScoreClass = 'text-high';
                            else if (news.score >= 50) newsScoreClass = 'text-mid';

                            const newsDate = news.date || news.collected_at || '';
                            const dateDisplay = newsDate ? `<div class="news-date">${newsDate}</div>` : '';
                            newsHtml += `
                           <li class="news-item">
                               <div class="news-score ${newsScoreClass}">${news.score}</div>
                               <div class="news-content">
                                   <a href="${news.link}" target="_blank" class="news-title">${news.title}</a>
                                   ${dateDisplay}
                                   <div class="news-reason">${news.reason}</div>
                               </div>
                           </li>
                       `;
                        });
                        newsHtml += '</ul>';
                    } else {
                        newsHtml = '<div class="no-news">No recent news analyzed.</div>';
                    }

                    const html = `
                    <div class="company-card" data-company="${company.company}">
                        <div class="company-info">
                            <h2>${company.company}</h2>
                            <div class="main-score ${scoreClass}">
                                <span class="score-label">AI SCORE</span>
                                <span class="score-value">${company.average_score}</span>
                            </div>
                            ${stockHtml}
                            ${accuracyStatsHtml}
                            ${evaluationHtml}
                            ${signalHtml}
                            <div class="updated-at">Updated: ${company.updated_at}</div>
                        </div>
                        <div class="company-news">
                            <h3>Latest Analysis</h3>
                            ${newsHtml}
                        </div>
                        <div class="company-graph">
                            <select class="company-graph-period" data-company="${company.company}">
                                <option value="week">週</option>
                                <option value="month" selected>月</option>
                                <option value="year">年</option>
                            </select>
                            <canvas id="chart-${company.company.replace(/\s+/g, '-')}"></canvas>
                        </div>
                    </div>
                `;
                    app.innerHTML += html;
                });
            });

            // 全ての企業カードが追加された後にグラフを描画
            setTimeout(() => {
                companies.forEach(company => {
                    const periodSelect = document.querySelector(`.company-graph-period[data-company="${company.company}"]`);
                    const period = periodSelect ? periodSelect.value : 'month';
                    drawCompanyGraph(company.company, historyData, period);

                    // 期間選択のイベントリスナーを追加
                    if (periodSelect) {
                        periodSelect.addEventListener('change', (e) => {
                            drawCompanyGraph(company.company, historyData, e.target.value);
                        });
                    }
                });
            }, 200);
        }




        // 初期データ読み込み
        console.log('Loading initial data...');
        Promise.all([
            fetch('data/current.json?' + new Date().getTime()).then(response => {
                console.log('Response status:', response.status);
                if (!response.ok) throw new Error("Data not found");
                return response.json();
            }),
            loadHistory()
        ]).then(([data]) => {
            console.log('Data loaded:', data);
            console.log('Companies count:', data.companies ? data.companies.length : 0);
            if (data && data.companies && data.companies.length > 0) {
                displayData(data);
            } else {
                console.error('No companies data found');
                document.getElementById('status').innerHTML =
                    'まだ水面は静かです。<br><small>(データが空です)</small>';
            }
        }).catch(err => {
            console.error('Error loading data:', err);
            document.getElementById('status').innerHTML =
                'まだ水面は静かです。<br><small>(データ読み込みエラー、または初回実行待ちです)</small>';
        });

        // 日付から履歴を検索
        function findHistoryByDate(dateStr) {
            if (!historyData || historyData.length === 0) {
                console.warn('履歴データが空です');
                return null;
            }

            const entry = historyData.find(entry => {
                if (!entry || !entry.timestamp) return false;
                const entryDate = entry.timestamp.split(' ')[0];
                return entryDate === dateStr;
            });

            if (!entry) {
                console.warn(`日付 ${dateStr} の履歴データが見つかりません`);
                console.log('利用可能な日付:', [...new Set(historyData.map(e => e.timestamp.split(' ')[0]))]);
            }

            return entry || null;
        }


        // 履歴ボタンのイベント
        document.getElementById('showHistoryBtn').addEventListener('click', () => {
            const select = document.getElementById('historySelect');
            const datePicker = document.getElementById('historyDatePicker');
            if (select.style.display === 'none') {
                loadHistory().then(() => {
                    select.style.display = 'inline-block';
                    datePicker.style.display = 'inline-block';
                });
            } else {
                select.style.display = 'none';
                datePicker.style.display = 'none';
            }
        });

        // カレンダー選択のイベント
        document.getElementById('historyDatePicker').addEventListener('change', (e) => {
            const selectedDate = e.target.value;
            if (selectedDate) {
                console.log(`カレンダーで日付を選択: ${selectedDate}`);
                // 履歴データを再読み込みしてから検索
                loadHistory().then(() => {
                    const entry = findHistoryByDate(selectedDate);
                    if (entry && entry.data) {
                        console.log('履歴データを表示:', entry.timestamp);
                        displayData(entry.data);
                    } else {
                        const availableDates = historyData.length > 0
                            ? [...new Set(historyData.map(e => e.timestamp.split(' ')[0]))].join(', ')
                            : 'なし';
                        alert(`選択した日付（${selectedDate}）のデータが見つかりません。\n\n利用可能な日付: ${availableDates}`);
                    }
                }).catch(err => {
                    console.error('履歴データの読み込みエラー:', err);
                    alert('履歴データの読み込みに失敗しました。コンソールを確認してください。');
                });
            }
        });

        // 履歴選択のイベント
        document.getElementById('historySelect').addEventListener('change', (e) => {
            const index = e.target.value;
            if (index === '') {
                // 最新データを表示
                fetch('data/current.json')
                    .then(response => response.json())
                    .then(data => {
                        // 履歴データも再読み込み
                        loadHistory().then(() => {
                            displayData(data);
                        });
                    })
                    .catch(err => console.error(err));
            } else {
                // 履歴データを表示
                const entryIndex = parseInt(index, 10);
                if (historyData[entryIndex] && historyData[entryIndex].data) {
                    console.log(`履歴を選択: インデックス ${entryIndex}, タイムスタンプ ${historyData[entryIndex].timestamp}`);
                    displayData(historyData[entryIndex].data);
                } else {
                    console.error(`履歴データが見つかりません: インデックス ${entryIndex}`);
                    console.log('利用可能な履歴数:', historyData.length);
                    alert(`履歴データの読み込みに失敗しました。\nインデックス: ${entryIndex}\n利用可能な履歴数: ${historyData.length}`);
                }
            }
        });


        // 業種メニューを更新
        function updateSectorMenu(allCompanies) {
            const menu = document.getElementById('sectorMenu');
            if (!menu) return;

            // 全データから業種を抽出してカウント
            const sectorsCount = {};
            allCompanies.forEach(company => {
                const sector = company.sector || 'その他';
                sectorsCount[sector] = (sectorsCount[sector] || 0) + 1;
            });

            // 業種をソート
            const sectors = Object.keys(sectorsCount).sort();

            menu.innerHTML = `
                <li class="menu-item ${!currentSectorFilter ? 'active' : ''}" onclick="selectSector('')">
                    <span>全業種</span>
                    <span class="menu-count">${allCompanies.length}</span>
                </li>
            `;

            sectors.forEach(sector => {
                const isActive = sector === currentSectorFilter;
                const li = document.createElement('li');
                li.className = `menu-item ${isActive ? 'active' : ''}`;
                li.onclick = () => selectSector(sector);
                li.innerHTML = `
                    <span>${sector}</span>
                    <span class="menu-count">${sectorsCount[sector]}</span>
                `;
                menu.appendChild(li);
            });
        }

        function selectSector(sector) {
            currentSectorFilter = sector;
            if (allCompaniesData.length > 0) {
                displayData({ companies: allCompaniesData, metadata: currentMetadata });
            }
        }

        // 検索入力のイベント
        document.getElementById('companySearch').addEventListener('input', () => {
            if (allCompaniesData.length > 0) {
                displayData({ companies: allCompaniesData, metadata: currentMetadata });
            }
        });
        async function loadHistory() {
            try {
                console.log('履歴データの読み込みを開始...');

                // 履歴ディレクトリのインデックスファイルを読み込む
                const indexResponse = await fetch('data/history/index.json');
                let dateFiles = [];

                if (indexResponse.ok) {
                    dateFiles = await indexResponse.json();
                    console.log(`インデックスから ${dateFiles.length} 個の日付ファイルを取得:`, dateFiles);
                } else {
                    console.warn('インデックスファイルが見つかりません。最近90日分を生成します。');
                    // インデックスがない場合、最近90日分の日付を生成
                    const today = new Date();
                    for (let i = 0; i < 90; i++) {
                        const date = new Date(today);
                        date.setDate(date.getDate() - i);
                        dateFiles.push(date.toISOString().split('T')[0]);
                    }
                }

                // 各日付ファイルから履歴を読み込む
                const historyPromises = dateFiles.map(async (date) => {
                    try {
                        const response = await fetch(`data/history/${date}.json`);
                        if (!response.ok) {
                            console.log(`履歴ファイルが見つかりません: ${date}.json`);
                            return [];
                        }
                        const data = await response.json();

                        // データ構造の検証
                        if (!Array.isArray(data)) {
                            console.warn(`履歴ファイルの形式が不正です: ${date}.json (配列ではありません)`);
                            return [];
                        }

                        // 各エントリの構造を検証
                        const validEntries = data.filter(entry => {
                            if (!entry || typeof entry !== 'object') return false;
                            if (!entry.timestamp || !entry.data) {
                                console.warn(`履歴エントリの形式が不正です: ${date}.json`, entry);
                                return false;
                            }
                            return true;
                        });

                        if (validEntries.length !== data.length) {
                            console.warn(`${date}.json: ${data.length} エントリ中 ${validEntries.length} エントリが有効です`);
                        }

                        console.log(`履歴ファイル読み込み成功: ${date}.json (${validEntries.length} エントリ)`);
                        return validEntries;
                    } catch (err) {
                        console.error(`履歴ファイルの読み込みエラー (${date}.json):`, err);
                        return [];
                    }
                });

                const dailyHistories = await Promise.all(historyPromises);
                console.log(`読み込んだ日付ファイル数: ${dailyHistories.length}`);

                // 全ての履歴をマージして時系列でソート
                historyData = dailyHistories
                    .flat()
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                console.log(`合計 ${historyData.length} 件の履歴エントリを読み込みました`);

                const select = document.getElementById('historySelect');
                const datePicker = document.getElementById('historyDatePicker');

                if (!select || !datePicker) {
                    console.error('履歴UI要素が見つかりません');
                    return;
                }

                select.innerHTML = '<option value="">最新データを表示</option>';

                // 日付の範囲を設定
                if (historyData.length > 0) {
                    const dates = historyData.map(entry => entry.timestamp.split(' ')[0]);
                    const uniqueDates = [...new Set(dates)];
                    const minDate = uniqueDates[uniqueDates.length - 1];
                    const maxDate = uniqueDates[0];
                    datePicker.min = minDate;
                    datePicker.max = maxDate;
                    console.log(`日付範囲: ${minDate} ～ ${maxDate}`);
                } else {
                    console.warn('履歴データが空です');
                }

                historyData.forEach((entry, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = entry.timestamp;
                    select.appendChild(option);
                });

                console.log('履歴データの読み込み完了');
            } catch (err) {
                console.error('履歴データの読み込みエラー:', err);
                console.error('エラー詳細:', err.stack);
                historyData = [];
            }
        }

    </script>
</body>
