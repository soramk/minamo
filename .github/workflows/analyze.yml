name: Daily Stock Analysis

on:
  # schedule:
  #   - cron: '0 23 * * *' # UTC 23:00 -> JST 08:00 (毎日実行)
  workflow_dispatch: # 手動実行ボタン用

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'  # pipのキャッシュを自動で有効化

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyzer.py

      - name: Copy web files to docs directory (if not already there)
        run: |
          cp index.html style.css minamo.png docs/ 2>/dev/null || echo "Web files already in docs/ or not found"

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stock data and history" && git push)